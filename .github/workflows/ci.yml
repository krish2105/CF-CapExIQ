name: CI

# Runs on the default branch and on every pull request into it, so the
# "require status checks before merging" branch rule has something to require.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The knowledge base is committed as a build artefact, so the build must
      # not need network access or an API key. Absent OPENAI_API_KEY the app
      # falls back to deterministic output and BM25-only retrieval.
      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-anywhere
